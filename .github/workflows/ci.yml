name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Integration tests need a real Postgres: bytea semantics, the unique index on secret_sha256 and
    # the user_trust view are all Postgres behaviour an in-memory database would fake differently.
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: kotatsuredo
          POSTGRES_USER: kotatsuredo
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotatsuredo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/kotatsuredo
      TEST_DATABASE_USER: kotatsuredo
      TEST_DATABASE_PASSWORD: ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test
        run: ./gradlew --no-daemon build

      # The integration tests skip themselves when no database is configured, which would let a
      # broken CI database turn into a silently green build. Fail loudly instead.
      - name: Fail if integration tests were skipped
        run: |
          report=build/test-results/test/TEST-io.kotatsuredo.server.AccountDeletionTest.xml
          if ! test -f "$report" || grep -q 'skipped="[1-9]' "$report"; then
            echo "Integration tests were skipped - TEST_DATABASE_URL is not reaching the test JVM."
            exit 1
          fi

      - name: Verify the Docker image builds
        run: docker build -t kotatsuredo-server:ci .

      - name: Scan the Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kotatsuredo-server:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: build/reports/tests/test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
