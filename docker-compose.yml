# Two containers plus a TLS terminator. That is the whole deployment (PLAN.md §A).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the api container needs to reach it.
    expose:
      - "5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8787}
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      # No default on purpose: a fallback would make every deployment's device hashes
      # interchangeable, and changing this invalidates every existing device ban.
      DEVICE_PEPPER: ${DEVICE_PEPPER}
      RULES_URL: ${RULES_URL:-/rules}
    expose:
      - "${PORT:-8787}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:-localhost}
      # So the reverse-proxy target follows PORT instead of drifting from it.
      API_PORT: ${PORT:-8787}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
